[project]
name = "remote-blender-mcp"
version = "0.1.0"
description = "Persistent remote Blender control through MCP and Modal Sandboxes"
readme = "README.md"
authors = [
    { name = "Zackariah Grogan", email = "info@grogan.dev" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "modal>=1.6.4,<2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
remote-blender-mcp = "remote_blender_mcp.server:main"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
